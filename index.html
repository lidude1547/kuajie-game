<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>跨界溝通大挑戰</title>
<style>
:root{
  --deep:#0B4F5C;--deep2:#093C47;--ink:#22313A;--mist:#EEF5F4;--card:#fff;--line:#D5E3E1;--mute:#5B6B73;
  --teal:#0E7C7B;--amber:#F2A541;--coral:#E4572E;--plum:#6C5B7B;--slate:#5B6B73;--good:#1B8F5A;--bad:#C2410C;
  --o0:#0E7C7B;--o1:#D98A12;--o2:#E4572E;--o3:#6C5B7B;--o4:#5B6B73;
  --rt:#0E7C7B;--rp:#F2A541;--rs:#E4572E;--ro:#8A7C99;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{font-family:var(--font);background:var(--mist);color:var(--ink);-webkit-text-size-adjust:100%;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}

/* ===== 觀眾（手機） ===== */
.pl{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--mist);position:relative}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.pl-brand{font-weight:800;color:var(--deep);letter-spacing:.02em;font-size:15px}
.pl-me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);min-width:0}
.pl-me b{color:var(--ink);max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.chip.t{background:var(--rt)}.chip.p{background:#D98A12}.chip.s{background:var(--rs)}.chip.o{background:var(--ro)}
.conn{background:var(--coral);color:#fff;text-align:center;padding:6px;font-size:13px;flex:none}
.pl-main{flex:1;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:12px 8px;font-size:15px;font-weight:700;color:var(--mute);border-top:3px solid transparent}
.tabs button.on{color:var(--teal);border-top-color:var(--teal)}
.tabs .badge{background:var(--coral);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 0 rgba(11,79,92,.06),0 6px 18px rgba(11,79,92,.06)}
.card+.card{margin-top:12px}
.kick{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--teal);margin:0 0 6px}
.pl h2{font-size:20px;margin:0 0 8px;line-height:1.35;color:var(--deep);text-wrap:balance}
.pl p{margin:0 0 8px}
.mute{color:var(--mute);font-size:14px}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
textarea.field{min-height:92px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:800;background:var(--teal);color:#fff;min-height:48px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 16px}
.roles button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:700;color:var(--ink);min-height:48px}
.roles button.on{border-color:var(--teal);background:#E3F2F1;color:var(--deep)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;font-size:16px;color:var(--ink);min-height:56px;line-height:1.45;width:100%}
.opt .ltr{flex:none;width:32px;height:32px;border-radius:10px;color:#fff;font-weight:800;display:grid;place-items:center}
.opt:nth-child(6) .ltr{background:var(--o0)}
.opt:nth-child(1) .ltr{background:var(--o0)}.opt:nth-child(2) .ltr{background:var(--o1)}.opt:nth-child(3) .ltr{background:var(--o2)}.opt:nth-child(4) .ltr{background:var(--o3)}.opt:nth-child(5) .ltr{background:var(--o4)}
.opt.sel{border-color:var(--teal);background:#E3F2F1}
.opt.ok{border-color:var(--good);background:#E4F5EC}
.opt.no{border-color:#E7A28A;background:#FDF0EB}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.timer{height:10px;border-radius:99px;background:#dbe6e4;overflow:hidden;margin:4px 0 12px}
.timer i{display:block;height:100%;width:100%;background:var(--teal);transition:width .25s linear,background .3s}
.timer.low i{background:var(--coral)}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:#fff;border-left:6px solid var(--teal)}
.fb.good{border-color:var(--good)}.fb.bad{border-color:var(--coral)}
.fb b{display:block;font-size:17px;margin-bottom:4px}
.board{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.board li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px}
.board .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--deep)}
.board li:nth-child(1) .no{background:var(--amber);color:#3a2a00}
.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.board .sc{font-weight:800;color:var(--teal)}
.stack{display:grid;gap:10px;margin-top:10px}
.srow .lab{font-size:14px;margin-bottom:3px}
.track{display:flex;height:22px;border-radius:8px;overflow:hidden;background:#e6eeed}
.track span{height:100%;width:0;transition:width .5s ease}
.track .t{background:var(--rt)}.track .p{background:var(--rp)}.track .s{background:var(--rs)}.track .o{background:var(--ro)}
.srow .val{font-size:13px;color:var(--mute);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.qitem{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.qitem+.qitem{margin-top:10px}
.qitem .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.qitem .by{font-size:12px;color:var(--mute);margin-top:2px}
.up{flex:none;border:2px solid var(--line);background:#fff;border-radius:12px;min-width:56px;padding:6px 8px;font-weight:800;color:var(--mute);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.up.on{border-color:var(--teal);color:var(--teal);background:#E3F2F1}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--good);color:#fff;margin-right:6px}
.wallcard{background:#fff;border-radius:12px;padding:10px 12px;border-left:5px solid var(--teal);overflow-wrap:anywhere}
.wallcard+.wallcard{margin-top:8px}
.wallcard.p{border-color:var(--rp)}.wallcard.s{border-color:var(--rs)}.wallcard.o{border-color:var(--ro)}
.wallcard small{display:block;color:var(--mute);margin-top:2px}
.wait{text-align:center;padding:28px 12px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--teal);margin:0 auto 14px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,124,123,.5)}100%{box-shadow:0 0 0 16px rgba(14,124,123,0)}}
.row{display:flex;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin:8px 0 12px}
.check input{width:20px;height:20px}

/* ===== 主持人（投影） ===== */
.host{height:100%;display:flex;flex-direction:column;background:radial-gradient(1200px 700px at 85% -10%,#12707a 0,transparent 60%),var(--deep);color:#fff;font-size:clamp(14px,1.25vw,22px)}
.h-top{display:flex;align-items:center;gap:20px;padding:12px 2.2vw;flex:none;background:rgba(0,0,0,.18)}
.h-brand{font-weight:800;font-size:1.25em;white-space:nowrap}
.h-brand small{display:block;font-size:.62em;color:#8CC5C0;font-weight:600;letter-spacing:.08em}
.steps{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.steps button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#cfe6e4;padding:5px 12px;border-radius:999px;font-size:.85em;font-weight:700}
.steps button.on{background:var(--amber);border-color:var(--amber);color:#2b1d00}
.steps button.past{background:rgba(255,255,255,.12)}
.h-stat{display:flex;align-items:center;gap:14px;white-space:nowrap}
.h-stat b{font-size:1.5em}
.h-q{background:var(--coral);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.85em}
.h-main{flex:1;min-height:0;padding:1.6vh 2.6vw;display:flex;flex-direction:column;gap:1.4vh;overflow-y:auto;scrollbar-width:none}.h-main::-webkit-scrollbar{display:none}
.h-bar{display:flex;align-items:center;gap:12px;padding:10px 2.2vw;background:rgba(0,0,0,.28);flex:none}
.h-bar .hint{flex:1;font-size:.8em;color:#9dc7c4}
.hbtn{border:0;border-radius:12px;padding:.7em 1.4em;font-size:1em;font-weight:800;background:var(--amber);color:#2b1d00}
.hbtn.sec{background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.hbtn.danger{background:rgba(228,87,46,.25);color:#ffd9cc}
.hbtn:disabled{opacity:.4}
.h-kick{color:var(--amber);font-weight:800;letter-spacing:.14em;font-size:.8em}
.h-title{font-size:clamp(22px,2.9vw,52px);font-weight:800;line-height:1.28;margin:.1em 0 0;text-wrap:balance}
.h-sub{color:#b9dcd9;font-size:1em}
.lobby{display:grid;grid-template-columns:minmax(300px,32vw) 1fr;gap:3vw;align-items:center;flex:1;min-height:0}
.qrcard{background:#fff;border-radius:24px;padding:18px;color:var(--ink);text-align:center}
.qrcard svg{width:100%;height:auto;display:block}
.qrcard .url{font-weight:800;font-size:clamp(14px,1.5vw,26px);word-break:break-all;margin-top:8px}
.qrcard .demo{color:var(--coral);font-weight:800;font-size:.8em}
.qrcard button{margin-top:6px;border:0;background:none;color:var(--teal);font-weight:700;text-decoration:underline;font-size:.8em}
.bigcount{font-size:clamp(40px,6vw,110px);font-weight:900;line-height:1}
.bigcount small{font-size:.28em;font-weight:700;color:#b9dcd9;margin-left:.3em}
.rolechips{display:flex;gap:10px;flex-wrap:wrap;margin:1.2vh 0}
.rolechips .chip{font-size:1em;padding:4px 14px}
.wbars{display:grid;gap:.9vh;margin-top:1.4vh;max-width:46vw}
.wrow{display:grid;grid-template-columns:minmax(0,17em) 1fr 2.2em;align-items:center;gap:12px;font-weight:700}
.wrow .wl{font-size:clamp(14px,1.9vh,20px)}
.wbar{height:2.2vh;min-height:12px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.wbar i{display:block;height:100%;width:0;background:var(--amber,#F2A541);border-radius:999px;transition:width .5s}
.wrow b{text-align:right;font-size:clamp(15px,2.2vh,24px)}
.cloud{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;margin-top:1vh;max-height:34vh;overflow:hidden}
.cloud span{background:rgba(255,255,255,.14);border-radius:999px;padding:.25em .9em;font-weight:700;animation:pop .4s both}
.cloud span:nth-child(3n){background:rgba(242,165,65,.3)}.cloud span:nth-child(3n+1){background:rgba(140,197,192,.25)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.4vw;margin-top:1vh}
.hopts.one{grid-template-columns:1fr}
.hopt{display:flex;gap:1vw;align-items:flex-start;background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:18px;padding:1.4vh 1.2vw;font-size:clamp(16px,1.8vw,32px);font-weight:700;line-height:1.35}
.hopt .ltr{flex:none;width:1.7em;height:1.7em;border-radius:.5em;display:grid;place-items:center;font-weight:900;color:#fff}
.hopt:nth-child(1) .ltr{background:var(--o0)}.hopt:nth-child(2) .ltr{background:var(--o1)}.hopt:nth-child(3) .ltr{background:var(--o2)}.hopt:nth-child(4) .ltr{background:var(--o3)}.hopt:nth-child(5) .ltr{background:var(--o4)}
.hopt .tx{flex:1;min-width:0}
.hopt .cnt{flex:none;font-size:.8em;color:#b9dcd9;font-weight:800;align-self:center}
.hopt.ok{background:rgba(27,143,90,.35);border-color:#4fd69a}
.hopt.dim{opacity:.45}
.hopt.best::after{content:"較建議";flex:none;align-self:center;background:#4fd69a;color:#05301f;border-radius:8px;padding:.1em .6em;font-size:.6em;font-weight:900}
.htimer{height:1.2vh;min-height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.htimer i{display:block;height:100%;width:100%;background:var(--amber);transition:width .25s linear}
.htimer.low i{background:var(--coral)}
.tnum{font-weight:900;font-size:clamp(28px,3.6vw,64px);min-width:2.2em;text-align:right}
.hrow{display:flex;align-items:center;gap:20px}
.hans{font-size:1em;color:#b9dcd9;font-weight:700}
.expl{background:rgba(255,255,255,.12);border-radius:18px;padding:1.4vh 1.4vw;font-size:clamp(15px,1.55vw,28px);line-height:1.5}
.expl b{color:var(--amber)}
.hstack{display:grid;gap:1.4vh;flex:1;align-content:center}.hstack .srow{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:1vw}.hstack .srow .track{grid-column:1/3;grid-row:2}.hstack .srow .val{grid-row:1;grid-column:2;margin:0}.hstack .srow .lab{grid-row:1;grid-column:1}
.hstack .srow .lab{font-size:clamp(16px,1.9vw,34px);margin-bottom:.3vh;font-weight:700}
.hstack .track{height:clamp(22px,3.6vh,44px);background:rgba(255,255,255,.14);border-radius:12px}
.hstack .val{font-size:clamp(14px,1.4vw,24px);color:#b9dcd9;font-weight:700;margin-top:.2vh}
.hlegend{display:flex;gap:18px;flex-wrap:wrap;color:#b9dcd9;font-size:.85em}
.hlegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.hboard{display:grid;gap:.9vh;flex:1;align-content:start}
.hboard .it{display:grid;grid-template-columns:2.4em 1fr 4.5em;align-items:center;gap:1vw;background:rgba(255,255,255,.1);border-radius:14px;padding:.5vh 1vw;font-size:clamp(15px,1.7vw,30px);font-weight:700;overflow:hidden;position:relative}
.hboard .it .bar{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(242,165,65,.35),rgba(242,165,65,.05));z-index:0;transition:width .6s}
.hboard .it>*{position:relative;z-index:1}
.hboard .no{font-weight:900;color:var(--amber)}
.hboard .sc{text-align:right;font-weight:900}
.wall{columns:3 260px;column-gap:1.2vw;flex:1;overflow:hidden}
.wall .wc{break-inside:avoid;background:rgba(255,255,255,.12);border-radius:16px;padding:1.2vh 1vw;margin-bottom:1.2vh;font-size:clamp(15px,1.6vw,28px);font-weight:600;border-left:8px solid var(--rt);animation:pop .4s both}
.wall .wc.p{border-color:var(--rp)}.wall .wc.s{border-color:var(--rs)}.wall .wc.o{border-color:var(--ro)}
.wall .wc small{display:block;color:#b9dcd9;font-weight:600;font-size:.7em;margin-top:.3em}
.hq{display:grid;gap:1vh;flex:1;align-content:start;overflow:auto}
.hq .qi{display:grid;grid-template-columns:4.2em 1fr auto;gap:1.2vw;align-items:center;background:rgba(255,255,255,.1);border-radius:16px;padding:1.1vh 1.2vw;font-size:clamp(16px,1.8vw,32px);font-weight:600}
.hq .qi.answered{opacity:.5}.hq .qi.hidden{opacity:.35;outline:2px dashed rgba(255,255,255,.4)}
.hq .vt{background:var(--amber);color:#2b1d00;border-radius:12px;font-weight:900;text-align:center;padding:.2em 0}
.hq small{display:block;color:#b9dcd9;font-size:.6em;font-weight:600}
.hq .ops{display:flex;gap:6px}
.hq .ops button{border:0;border-radius:8px;padding:.3em .8em;font-size:.6em;font-weight:800;background:rgba(255,255,255,.18);color:#fff}
.endstats{display:flex;gap:2vw;flex-wrap:wrap}
.endstats div{background:rgba(255,255,255,.12);border-radius:18px;padding:1.4vh 2vw;text-align:center}
.endstats b{display:block;font-size:clamp(30px,4vw,70px);color:var(--amber)}
.demo-banner{position:fixed;left:0;right:0;top:0;background:var(--coral);color:#fff;text-align:center;font-weight:700;padding:4px 8px;font-size:13px;z-index:50}
.demo-tools{position:fixed;left:14px;bottom:70px;z-index:40;display:flex;gap:8px}
.phone{position:fixed;right:10px;bottom:56px;width:330px;height:600px;transform:scale(.72);border:10px solid #0b1f26;border-radius:34px;overflow:hidden;z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff;transform-origin:bottom right}
.phone.min{height:48px;width:200px}
.phone .pl{height:100%}
.phone-bar{position:absolute;top:0;left:0;right:0;height:0}
.phone-toggle{position:fixed;right:20px;bottom:64px;z-index:41}
@media (max-width:900px){.lobby{grid-template-columns:1fr}.hopts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hopt .tx .track.mini{height:12px;margin-top:.5vh;background:rgba(255,255,255,.14)}.hopt .tx .val{font-size:.6em;color:#b9dcd9;font-weight:700;margin-top:.1vh}.hopt .tx .mini.off,.hopt .tx .mini.off+.val{display:none}
.hopts.one .hopt{font-size:clamp(15px,1.55vw,28px);padding:1vh 1.2vw}

.qrcard .pub{display:flex;gap:6px;margin-top:8px}.qrcard .pub input{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.7em}.qrcard .pub button{margin:0;border:0;background:var(--teal);color:#fff;border-radius:8px;padding:6px 12px;text-decoration:none;font-weight:800;font-size:.7em}

</style>
</head>
<body>
<div id="app"></div>

<script>
/* Minimal QR Code encoder: byte mode, error correction level M, versions 1-10. */
const QR = (function () {
  const ECC_PER_BLOCK = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26];
  const NUM_BLOCKS = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];
  function rawModules(v) {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; }
    return r;
  }
  function alignPos(v) {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, size = v * 4 + 17;
    const step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2;
    const res = [6];
    for (let p = size - 7; res.length < n; p -= step) res.splice(1, 0, p);
    return res;
  }
  function gfMul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z; }
  function rsDivisor(deg) {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < deg; j++) { r[j] = gfMul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; } root = gfMul(root, 2); }
    return r;
  }

    case "answer": {
      if (!isQuiz(S.stage) || S.phase !== "open" || S.qi < 0) return { err: "closed" };
      if (S.deadline && now > S.deadline + 1500) return { err: "late" };
      const q = items(S)[S.qi], o = num(a.opt, q.o.length); if (o < 0) return { err: "bad" };
      const k = keyOf(S); S.ans[k] = S.ans[k] || {};
      if (S.ans[k][pid]) return { err: "done" };
      const limit = CONTENT[S.stage].limit * 1000;
      const left = Math.max(0, Math.min(limit, S.deadline - now));
      S.ans[k][pid] = { o, p: o === q.a ? Math.round(500 + (500 * left) / limit) : 0 };
      bump(S); return { ok: 1 };
    }
    case "choose": {
      if (S.stage !== "r4" || S.phase !== "open" || S.qi < 0) return { err: "closed" };
      const q = items(S)[S.qi], o = num(a.opt, q.o.length); if (o < 0) return { err: "bad" };
      const k = keyOf(S); S.r4[k] = S.r4[k] || {}; S.r4[k][pid] = o; bump(S); return { ok: 1 };
    }
    case "pledge": {
      if (S.stage !== "r5") return { err: "closed" };
      const x = clean(a.text, 80); if (!x) return { err: "empty" };

    }
    case "ask": {
      const x = clean(a.text, 140); if (!x) return { err: "empty" };
      if (S.qs.filter((q) => q.pid === pid).length >= 6) return { err: "limit" };

    }
    case "upvote": {
      const q = S.qs.find((x) => x.id === a.id);

      const i = q.votes.indexOf(pid); if (i >= 0) q.votes.splice(i, 1); else q.votes.push(pid);
      bump(S); return { ok: 1 };
    }
  }
  return { err: "unknown" };
}

function tick(S, now) {
  if (S.phase === "open" && S.deadline && now > S.deadline + 400 && isQuiz(S.stage)) { if (reveal(S, now)) { bump(S); return true; } }
  return false;
}

/* ---------------- 檢視（要送給畫面的資料） ---------------- */
function board(S) {
  if (S._bv === S.ver && S._b) return S._b;
  const tot = {};
  for (const k of Object.keys(S.revealed)) {
    if (!isQuiz(k.split(":")[0])) continue;
    const m = S.ans[k] || {};
    for (const pid of Object.keys(m)) tot[pid] = (tot[pid] || 0) + m[pid].p;
  }
  const list = Object.keys(S.players).map((pid) => ({ pid, name: S.players[pid].name, role: S.players[pid].role, score: tot[pid] || 0 }));
  list.sort((a, b) => b.score - a.score || (S.players[a.pid].at - S.players[b.pid].at));
  const rank = {}; list.forEach((p, i) => { rank[p.pid] = i + 1; });
  const anyRevealed = Object.keys(S.revealed).some((k) => isQuiz(k.split(":")[0]));
  S._b = { list, rank, tot, anyRevealed }; S._bv = S.ver;
  return S._b;
}
function roleCounts(S) {
  const rc = { t: 0, p: 0, s: 0, o: 0 };
  for (const pid of Object.keys(S.players)) rc[S.players[pid].role]++;
  return rc;
}
function distOf(map, n, S) {
  const d = Array.from({ length: n }, () => ({ t: 0, p: 0, s: 0, o: 0, all: 0 }));
  for (const pid of Object.keys(map || {})) {
    const v = map[pid], o = typeof v === "object" ? v.o : v, p = S.players[pid];
    if (!p || o == null || !d[o]) continue;
    d[o][p.role]++; d[o].all++;
  }
  return d;
}
function viewCommon(S, host, now) {
  now = now || Date.now();
  const st = S.stage, shown = S.phase === "revealed" || S.phase === "done";
  const c = {
    ver: S.ver, now, stage: st, qi: S.qi, phase: S.phase, deadline: S.deadline,
    count: Object.keys(S.players).length, roles: roleCounts(S),
    qaCount: S.qs.filter((q) => q.status === "open").length,
  };
  if (st === "lobby") {
    c.warmDist = CONTENT.warmOpts.map(() => 0);
    Object.keys(S.warm).forEach((pid) => { const w = S.warm[pid]; if (c.warmDist[w] != null) c.warmDist[w]++; });
    c.warmCount = Object.keys(S.warm).length;
  } else if (st === "r1") {
    c.answered = Object.keys(S.r1).length;
    if (shown || host) c.dist = distOf(S.r1, CONTENT.r1.opts.length, S);
  } else if (isQuiz(st) && S.qi >= 0) {
    const q = items(S)[S.qi], k = keyOf(S);
    c.q = { t: q.t, o: q.o, n: items(S).length };
    c.answered = Object.keys(S.ans[k] || {}).length;
    if (shown) { c.q.a = q.a; c.q.x = q.x; c.dist = distOf(S.ans[k], q.o.length, S); }
  } else if (st === "r4" && S.qi >= 0) {
    const q = items(S)[S.qi], k = keyOf(S);
    c.q = { t: q.t, o: q.o, n: items(S).length, who: q.who };
    c.answered = Object.keys(S.r4[k] || {}).length;
    if (shown) { c.q.a = q.a; c.q.x = q.x; c.dist = distOf(S.r4[k], q.o.length, S); }
  } else if (st === "r5") {
    c.pledges = S.pledges.slice(-40).reverse().map((p) => ({ id: p.id, text: p.text, name: (S.players[p.pid] || {}).name || "", role: (S.players[p.pid] || {}).role || "o" }));
    c.pledgeCount = S.pledges.length;
  }
  if ((isQuiz(st) && (shown || S.phase === "idle")) || st === "end") {
    const b = board(S);
    if (b.anyRevealed) c.top = b.list.slice(0, 10).map((p) => ({ name: p.name, role: p.role, score: p.score }));
  }
  c.qs = S.qs.filter((q) => host || q.status !== "hidden").map((q) => ({
    id: q.id, text: q.text, name: q.anon ? "" : (S.players[q.pid] || {}).name || "", role: q.anon ? "" : (S.players[q.pid] || {}).role || "",
    votes: q.votes.length, status: q.status, at: q.at,
  })).sort((a, b) => (a.status === "answered") - (b.status === "answered") || b.votes - a.votes || a.at - b.at).slice(0, 80);
  if (st === "end") {
    c.summary = { players: c.count, pledges: S.pledges.length, questions: S.qs.length, answered: S.qs.filter((q) => q.status === "answered").length };
  }
  return c;
}
function viewMe(S, pid) {
  const p = S.players[pid];
  if (!p) return { joined: false };
  const b = board(S), st = S.stage, k = keyOf(S);
  const me = { joined: true, k: st + ":" + S.qi, name: p.name, role: p.role, score: b.tot[pid] || 0, rank: b.anyRevealed ? b.rank[pid] : 0, warm: S.warm[pid] == null ? -1 : S.warm[pid], pledgeLeft: 3 - S.pledges.filter((x) => x.pid === pid).length, askLeft: 6 - S.qs.filter((x) => x.pid === pid).length };
  me.voted = S.qs.filter((q) => q.votes.includes(pid)).map((q) => q.id);
  me.mine = S.qs.filter((q) => q.pid === pid).map((q) => q.id);
  if (st === "r1") me.pick = S.r1[pid] == null ? -1 : S.r1[pid];
  if (isQuiz(st) && S.qi >= 0) { const a = (S.ans[k] || {})[pid]; me.pick = a ? a.o : -1; me.pts = a && (S.phase !== "open") ? a.p : 0; }
  if (st === "r4" && S.qi >= 0) { const a = (S.r4[k] || {})[pid]; me.pick = a == null ? -1 : a; }
  return me;
}
function exportCsv(S) {
  const q = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const rn = (k) => (ROLES.find((r) => r.k === k) || {}).n || k;
  const lines = [];
  lines.push("# 提問"); lines.push(["編號", "狀態", "票數", "提問者", "身分", "問題"].map(q).join(","));

  lines.push(""); lines.push("# 行動承諾"); lines.push(["暱稱", "身分", "承諾"].map(q).join(","));
  S.pledges.forEach((x) => lines.push([(S.players[x.pid] || {}).name, rn((S.players[x.pid] || {}).role), x.text].map(q).join(",")));
  lines.push(""); lines.push("# 溫度計（最難說得通的關係）"); lines.push(["選項", "老師", "家長", "專業人員", "其他", "合計"].map(q).join(","));
  distOf(S.r1, CONTENT.r1.opts.length, S).forEach((d, i) => lines.push([CONTENT.r1.opts[i], d.t, d.p, d.s, d.o, d.all].map(q).join(",")));

  board(S).list.forEach((p, i) => lines.push([i + 1, p.name, rn(p.role), p.score].map(q).join(",")));
  return "﻿" + lines.join("\r\n");
}

  /* ====================== 傳輸層 ====================== */

  /* ====================== 免伺服器模式：經公用 MQTT 中繼站（WebSocket） ====================== */
  const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt", "wss://test.mosquitto.org:8081/"];

  function Mqtt(url, subs, h) {

        const cid = "kj" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        sendRaw(pkt(0x10, cat([strB("MQTT"), Uint8Array.of(4, 2), u16(30), strB(cid)])));

  const roomTopic = (code) => "kuajie/v1/" + code;

  function relayTransport(code, pid) {

    };
  }

  function startRelayHost(hub, code, key, diag) {
    const p = roomTopic(code), urls = brokerList().slice(0, 2), known = new Set();
    const lastMe = {}; let lastC = "", dirty = true, mqs = []; const epoch = Date.now();

  }

  function bootDemo(root) {
    // 示範模式（直接開啟檔案）：主持人畫面 + 手機預覽 + 模擬觀眾
    const hub = makeHub();
    document.body.insertAdjacentHTML("afterbegin", '<div class="demo-banner">示範模式：資料只存在這個視窗，手機掃 QR 無法加入。現場請執行 node server.js，並用電腦開啟顯示的 /host 網址。</div>');
    root.style.cssText = "height:100%;padding-top:26px";
    const hostEl = document.createElement("div"); hostEl.style.height = "100%"; root.appendChild(hostEl);
    mountHost(hostEl, localTransport(hub, "host-main", true));
    const ph = document.createElement("div"); ph.className = "phone"; document.body.appendChild(ph);
    mountPlayer(ph, localTransport(hub, "demo-viewer-1", false));
    const tools = document.createElement("div"); tools.className = "demo-tools";
    tools.innerHTML = '<button class="hbtn sec" id="addbots">＋ 加入 20 位模擬觀眾</button><button class="hbtn sec" id="tphone">收合／展開手機預覽</button>';
    document.body.appendChild(tools);
    tools.querySelector("#addbots").onclick = () => startBots(hub, 20);
    tools.querySelector("#tphone").onclick = () => ph.classList.toggle("hidden");
    setTimeout(() => startBots(hub, 24), 400);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
</body>
</html>
